# DSH Configuration with Notify Plugin
# Copy this to your DSH config and adjust the path

plugins:
  - id: notify
    name: "@dsh/plugin-notify"
    # Replace with your actual plugin path
    # After git clone: ~/.dsh/plugins/dsh-notify
    path: ~/.dsh/plugins/dsh-notify
    config:
      enabled: true
      channels:
        system:
          enabled: true
          sound: true
        webhook:
          enabled: false
          url: ""
        wecom:
          enabled: false
          webhookUrl: ""
      events:
        conversationCompleted: true
        conversationPaused: true
        conversationFailed: true
        authorizationRequired: true
        confirmationRequired: true
      titlePrefix: "[DSH]"
