# DSH Notify Plugin Configuration Example
# 
# Copy this file to your DSH configuration directory and customize as needed.
# Typical locations:
# - ~/.dsh/notify.config.yml
# - ./dsh-notify.config.yml (project-level)

# Enable or disable the entire plugin
enabled: true

# Notification channels configuration
channels:
  # Desktop system notifications
  system:
    enabled: true
    sound: true
    # Optional: macOS system sound name (Glass, Ping, Sosumi, Basso, ...)
    # soundName: Glass
    # Optional: custom audio file played with the notification (overrides soundName)
    # soundFile: /path/to/alert.wav
    # Optional: per-event-type macOS sound names (highest priority)
    # sounds:
    #   conversationFailed: Basso
    #   conversationCompleted: Glass
    # Optional: custom icon path
    # icon: /path/to/icon.png
  
  # HTTP Webhook notifications
  webhook:
    enabled: false
    url: https://your-webhook-endpoint.com/notify
    method: POST
    timeout: 5000
    headers:
      Authorization: Bearer your-secret-token
      X-Custom-Header: custom-value
  
  # Enterprise WeChat (WeCom) bot notifications
  wecom:
    enabled: false
    webhookUrl: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_WEBHOOK_KEY
    msgType: markdown  # or 'text'
    mentions:
      - '@all'
      # - specific_user_id

  # WeChat ClawBot (personal WeChat, Tencent iLink official channel)
  # Enable, then scan the QR code shown in the settings page and send the
  # bot one message in WeChat so it can push notifications to you.
  wechat:
    enabled: false
    toUserIds: []  # restrict push targets (xxx@im.wechat); empty = all users who messaged the bot
    interactive: true  # two-way: reply in WeChat to approve (Y/N), answer questions, continue sessions
    # sessionFile: /path/to/wechat-session.json  # default: <DSH_HOME>/notify/wechat-session.json

  # Telegram bot notifications
  # Setup: create a bot with @BotFather, then find your chat ID
  # (e.g. via getUpdates after messaging the bot, or @userinfobot)
  telegram:
    enabled: false
    botToken: YOUR_BOT_TOKEN
    chatId: YOUR_CHAT_ID
    parseMode: HTML  # HTML | MarkdownV2 | text
    disableNotification: false

# Event filters - control which events trigger notifications
events:
  conversationCompleted: true
  conversationPaused: true
  conversationFailed: true
  authorizationRequired: true
  confirmationRequired: true

# Optional prefix for all notification titles
titlePrefix: '[DSH]'
